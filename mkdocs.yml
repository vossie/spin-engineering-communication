site_name: S.P.I.N. Engineering Communication Standard
site_description: Clear Issues. Appropriate Urgency. Better Engineering.
site_url: https://OWNER.github.io/spin-engineering-communication/
repo_url: https://github.com/OWNER/spin-engineering-communication
repo_name: spin-engineering-communication
copyright: Documentation licensed CC BY 4.0 · Site code licensed MIT

theme:
  name: material
  logo: assets/spin-logo.svg
  favicon: assets/spin-logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: spin-light
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: Use dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: spin-dark
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Use light theme
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - The Framework: framework.md
  - Specification: specification.md
  - Priority Guidelines: priorities.md
  - Ownership: ownership.md
  - Escalation: escalation.md
  - Examples: examples.md
  - Adoption Guide: adoption-guide.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

plugins:
  - search

