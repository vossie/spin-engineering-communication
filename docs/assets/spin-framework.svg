<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">The four S.P.I.N. fields</title>
  <desc id="desc">Subject and Priority are required. Impact and Note are optional.</desc>
  <rect width="960" height="300" rx="28" fill="#0b1220"/>
  <path d="M120 150h720" stroke="#334155" stroke-width="4"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(50 55)"><rect width="190" height="190" rx="24" fill="#1d4ed8"/><text x="24" y="55" fill="#fff" font-size="44" font-weight="700">S</text><text x="24" y="92" fill="#dbeafe" font-size="24" font-weight="600">Subject</text><text x="24" y="132" fill="#fff" font-size="18">What + owner</text><text x="24" y="166" fill="#bfdbfe" font-size="15">REQUIRED</text></g>
    <g transform="translate(275 55)"><rect width="190" height="190" rx="24" fill="#b45309"/><text x="24" y="55" fill="#fff" font-size="44" font-weight="700">P</text><text x="24" y="92" fill="#fef3c7" font-size="24" font-weight="600">Priority</text><text x="24" y="132" fill="#fff" font-size="18">Urgency + response</text><text x="24" y="166" fill="#fde68a" font-size="15">REQUIRED</text></g>
    <g transform="translate(500 55)"><rect width="190" height="190" rx="24" fill="#0f766e"/><text x="24" y="55" fill="#fff" font-size="44" font-weight="700">I</text><text x="24" y="92" fill="#ccfbf1" font-size="24" font-weight="600">Impact</text><text x="24" y="132" fill="#fff" font-size="18">Affected scope</text><text x="24" y="166" fill="#99f6e4" font-size="15">OPTIONAL</text></g>
    <g transform="translate(725 55)"><rect width="190" height="190" rx="24" fill="#15803d"/><text x="24" y="55" fill="#fff" font-size="44" font-weight="700">N</text><text x="24" y="92" fill="#dcfce7" font-size="24" font-weight="600">Note</text><text x="24" y="132" fill="#fff" font-size="18">Evidence + context</text><text x="24" y="166" fill="#bbf7d0" font-size="15">OPTIONAL</text></g>
  </g>
</svg>

