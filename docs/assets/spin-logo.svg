<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-labelledby="title desc">
  <title id="title">S.P.I.N. logo</title>
  <desc id="desc">Four connected blocks labelled S, P, I and N.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="320" height="96" rx="18" fill="#0b1220"/>
  <path d="M30 48h260" stroke="#5b9cff" stroke-width="3" opacity=".5"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <rect x="18" y="18" width="60" height="60" rx="14" fill="url(#g)"/><text x="48" y="58" fill="#fff">S</text>
    <rect x="93" y="18" width="60" height="60" rx="14" fill="#1d4ed8"/><text x="123" y="58" fill="#fff">P</text>
    <rect x="168" y="18" width="60" height="60" rx="14" fill="#0f766e"/><text x="198" y="58" fill="#fff">I</text>
    <rect x="243" y="18" width="60" height="60" rx="14" fill="#15803d"/><text x="273" y="58" fill="#fff">N</text>
  </g>
</svg>

